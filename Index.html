<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kora Estudio - Arquitectura Interior y Reforma Integral</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['Lora', 'serif'],
            sans: ['Plus Jakarta Sans', 'sans-serif'],
          },
          colors: {
            brand: {
              DEFAULT: '#B4562D',
              hover: '#994622',
              light: '#F7EAE3',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-[#F3F1ED] font-sans text-stone-800 antialiased p-4 md:p-8">

  <div class="max-w-7xl mx-auto bg-white rounded-2xl shadow-sm overflow-hidden border border-stone-200/60">
    
    <header class="bg-white px-6 md:px-12 py-5 flex items-center justify-between border-b border-stone-100">
      <a href="#" class="flex items-center gap-3 group">
        <div class="w-9 h-9 bg-brand rounded-lg flex items-center justify-center text-white shadow-sm group-hover:bg-brand-hover transition-colors">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3v3" />
            <path d="M7 20l5-14 5 14" />
            <path d="M9 14h6" />
          </svg>
        </div>
        <span class="font-serif font-bold text-xl tracking-tight text-stone-900">
          Kora Estudio
        </span>
      </a>

      <nav class="hidden lg:flex items-center gap-7 text-sm font-medium">
        <a href="#" class="flex items-center gap-2 text-brand border-b-2 border-brand pb-1.5 font-semibold">
          <i data-lucide="home" class="w-4 h-4"></i>
          <span>Inicio</span>
        </a>

        <a href="#" class="flex items-center gap-2 text-stone-600 hover:text-brand pb-1.5 transition-colors">
          <i data-lucide="layout" class="w-4 h-4"></i>
          <span>Espacios</span>
        </a>

        <a href="#" class="flex items-center gap-2 text-stone-600 hover:text-brand pb-1.5 transition-colors">
          <i data-lucide="users" class="w-4 h-4"></i>
          <span>Nosotros</span>
        </a>

        <a href="#" class="flex items-center gap-2 text-stone-600 hover:text-brand pb-1.5 transition-colors">
          <i data-lucide="layout-grid" class="w-4 h-4"></i>
          <span>Proyectos</span>
        </a>

        <a href="#" class="flex items-center gap-2 text-stone-600 hover:text-brand pb-1.5 transition-colors">
          <i data-lucide="star" class="w-4 h-4"></i>
          <span>Testimonios</span>
        </a>

        <a href="#" class="flex items-center gap-2 text-stone-600 hover:text-brand pb-1.5 transition-colors">
          <i data-lucide="mail" class="w-4 h-4"></i>
          <span>Contacto</span>
        </a>
      </nav>

      <button class="lg:hidden p-2 text-stone-600 hover:text-stone-900" aria-label="Abrir menú">
        <i data-lucide="menu" class="w-6 h-6"></i>
      </button>
    </header>

  
</section>
</body>
</html>
